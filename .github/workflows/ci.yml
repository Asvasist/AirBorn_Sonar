name: CI

on:
  push:
  pull_request:

jobs:
  firmware-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host unit tests
        run: |
          cmake -S firmware/tests -B build/host-tests -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build/host-tests
          ctest --test-dir build/host-tests --output-on-failure

  firmware-static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          pipx install clang-format==18.1.8
      - name: clang-format
        run: clang-format --dry-run --Werror firmware/src/*.[ch] firmware/tests/*.[ch]
      - name: cppcheck (hardware-independent modules)
        run: |
          cppcheck --std=c11 --enable=warning,style,performance,portability --error-exitcode=1 \
                   --inline-suppr --suppress=missingIncludeSystem -I firmware/src \
                   firmware/src/sonar_{pdm,wav,cycle,frames,console_buffer,control_protocol,number,scan360,experiment_config,config,health,profile,mic,speaker,codec_bus}.c

  gui-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GUI unit tests
        working-directory: gui
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
